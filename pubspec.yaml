name: codecelix_task_manager
description: "A new Flutter project."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.3

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  google_sign_in: ^6.3.0
  firebase_messaging: ^16.0.4

  # Local notifications
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # helpers
  uuid: ^4.5.2
  date_time_picker: ^2.1.0
  flutter_slidable: ^4.0.3
  intl: ^0.17.0
  glassmorphism: ^3.0.0
  shimmer: ^3.0.0
  lottie: ^3.3.2
  shared_preferences: ^2.5.3
  animated_text_kit: ^4.3.0

  # Icons
  font_awesome_flutter: ^10.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0


flutter:
  assets:
    - assets/logo.png
    - assets/google_logo.png


  uses-material-design: true

